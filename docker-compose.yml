services:
  eve-redis:
    image: redis:7-alpine
    container_name: eve-redis
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  eve-chromadb:
    image: chromadb/chroma:0.4.24
    container_name: eve-chromadb
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./data/chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  eve-discord-bot:
    build: .
    container_name: eve-discord-bot
    network_mode: "host"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - OLLAMA_BASE=http://localhost:11434
      - CHROMADB_HOST=localhost
      - CHROMADB_PORT=8000
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
    depends_on:
      - eve-redis
      - eve-chromadb
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
